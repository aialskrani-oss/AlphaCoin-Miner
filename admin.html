<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>لوحة الأدمن | AlphaCoin</title>
    <link rel="stylesheet" href="style.css"/>
    <style>
      body{background:#0a0a0f;color:#e0e0e0;font-family:sans-serif;padding:0;margin:0}
      #admin-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:1.2rem;color:#888}
      #admin-panel{display:none;max-width:900px;margin:0 auto;padding:1.5rem}
      .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;border-bottom:1px solid #2a2a3a;padding-bottom:1rem}
      .admin-header h1{color:var(--gold,#ffd700);font-size:1.5rem;margin:0}
      .admin-section{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
      .admin-section h2{margin:0 0 1rem;color:var(--primary,#00d4ff);font-size:1rem}
      .form-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
      .inp{background:#1a1a2e;border:1px solid #333;border-radius:8px;color:#e0e0e0;padding:.6rem .9rem;flex:1;min-width:160px;font-size:.95rem}
      .inp:focus{outline:none;border-color:var(--primary,#00d4ff)}
      .btn-gold{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;border:none;border-radius:8px;padding:.6rem 1.2rem;font-weight:700;cursor:pointer;white-space:nowrap}
      .btn-gold:disabled{opacity:.5;cursor:not-allowed}
      .btn-danger{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:.5rem 1rem;font-weight:700;cursor:pointer}
      .admin-msg{margin-top:.6rem;font-size:.9rem;min-height:1.2em}
      .admin-msg.ok{color:#22c55e}.admin-msg.err{color:#ef4444}
      .users-table{width:100%;border-collapse:collapse;font-size:.88rem}
      .users-table th{color:#888;padding:.5rem;text-align:right;border-bottom:1px solid #2a2a3a}
      .users-table td{padding:.5rem;border-bottom:1px solid #1e1e2e;vertical-align:middle}
      .badge-active{background:#15803d;color:#fff;border-radius:4px;padding:2px 6px;font-size:.78rem}
      .badge-used{background:#374151;color:#9ca3af;border-radius:4px;padding:2px 6px;font-size:.78rem}
      @media(max-width:500px){.form-row{flex-direction:column}}
    </style>
  </head>
  <body>
  <div id="admin-loading">⏳ جار التحقق من الصلاحيات…</div>

  <div id="admin-panel">
    <div class="admin-header">
      <h1>🔐 لوحة تحكم AlphaCoin</h1>
      <div style="display:flex;gap:.8rem;align-items:center">
        <span id="admin-user-label" style="color:#888;font-size:.9rem"></span>
        <button class="btn-danger" id="admin-logout">خروج</button>
        <a href="/" style="color:#888;font-size:.9rem">← الرئيسية</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="admin-section">
      <h2>📊 إحصائيات سريعة</h2>
      <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
        <div><div style="font-size:2rem;font-weight:700;color:var(--gold,#ffd700)" id="stat-users">-</div><div style="color:#888;font-size:.85rem">مستخدم</div></div>
        <div><div style="font-size:2rem;font-weight:700;color:var(--primary,#00d4ff)" id="stat-total">-</div><div style="color:#888;font-size:.85rem">إجمالي α</div></div>
        <div><div style="font-size:2rem;font-weight:700;color:#22c55e" id="stat-coupons">-</div><div style="color:#888;font-size:.85rem">قسيمة نشطة</div></div>
      </div>
    </div>

    <!-- Create coupon -->
    <div class="admin-section">
      <h2>🎁 إنشاء قسيمة</h2>
      <div class="form-row">
        <input class="inp" id="new-coupon-code"   type="text"   placeholder="كود القسيمة (اتركه فارغاً للتوليد)" style="direction:ltr"/>
        <input class="inp" id="new-coupon-reward" type="number" placeholder="المكافأة (α)" min="0.01" step="0.01" value="5"/>
        <button class="btn-gold" id="create-coupon-btn">إنشاء</button>
      </div>
      <div class="admin-msg" id="coupon-create-msg"></div>
    </div>

    <!-- Coupons table -->
    <div class="admin-section">
      <h2>📋 القسائم الحالية</h2>
      <div style="overflow-x:auto">
        <table class="users-table" id="coupons-table">
          <thead><tr><th>الكود</th><th>المكافأة</th><th>الحالة</th><th>الاستخدامات</th><th>إجراء</th></tr></thead>
          <tbody id="coupons-body"><tr><td colspan="5" style="text-align:center;padding:2rem;color:#555">جار التحميل…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Users table -->
    <div class="admin-section">
      <h2>👥 المستخدمون</h2>
      <div style="overflow-x:auto">
        <table class="users-table">
          <thead><tr><th>المستخدم</th><th>البريد</th><th>الرصيد (α)</th><th>الإجمالي</th></tr></thead>
          <tbody id="users-body"><tr><td colspan="4" style="text-align:center;padding:2rem;color:#555">جار التحميل…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="admin.js"></script>
  </body>
  </html>
