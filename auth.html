<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول – AlphaCoin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }
    .logo { font-size: 4rem; }
    h2 { color: #f0b429; font-size: 1.5rem; }
    p  { color: #888; font-size: 0.95rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #333;
      border-top-color: #f0b429;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 0.9rem; color: #aaa; min-height: 1.5em; }
    .status.err { color: #e74c3c; }
  </style>
</head>
<body>
  <div class="logo">⚡</div>
  <h2>جار تسجيل الدخول…</h2>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">يرجى الانتظار</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDU1VImzIYrQcJrh-K-r-qg10pU4dfx7bfs",
  authDomain: "aiph-acon.firebaseapp.com",
  databaseURL: "https://aiph-acon-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aiph-acon",
  storageBucket: "aiph-acon.firebasestorage.app",
  messagingSenderId: "260450986761",
  appId: "1:260450986761:web:6a33ade232f9831a30a768"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const statusEl  = document.getElementById("status");
const spinnerEl = document.getElementById("spinner");

async function doLogin() {
  try {
    statusEl.textContent = "يتم فتح Google…";
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    statusEl.textContent = `✅ تم! مرحباً ${result.user.displayName}`;
    spinnerEl.style.borderTopColor = "#2ecc71";
    // notify opener and close
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: "AUTH_SUCCESS" }, "*");
    }
    setTimeout(() => window.close(), 1200);
  } catch (e) {
    spinnerEl.style.display = "none";
    statusEl.className = "status err";
    statusEl.textContent = "خطأ: " + (e.message || e.code);
  }
}

// Check if already signed in
onAuthStateChanged(auth, user => {
  if (user) {
    statusEl.textContent = `✅ مرحباً ${user.displayName}`;
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: "AUTH_SUCCESS" }, "*");
    }
    setTimeout(() => window.close(), 800);
  } else {
    doLogin();
  }
});
</script>
</body>
</html>
