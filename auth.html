<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>تسجيل الدخول – AlphaCoin</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0a0a0a; color: #e8e8e8;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; flex-direction: column; gap: 1.2rem;
        text-align: center; padding: 2rem;
      }
      .logo { font-size: 4rem; filter: drop-shadow(0 0 20px #f0b429); }
      h2 { color: #f0b429; font-size: 1.4rem; }
      p  { color: #888; font-size: 0.9rem; max-width: 320px; line-height: 1.5; }
      .card {
        background: #111; border: 1px solid #222; border-radius: 14px;
        padding: 1.8rem; width: 100%; max-width: 360px; display: flex;
        flex-direction: column; gap: 1rem;
      }
      .field { display: flex; flex-direction: column; gap: .4rem; text-align: right; }
      .field label { font-size: .85rem; color: #aaa; }
      .inp {
        background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
        color: #e8e8e8; padding: .7rem 1rem; font-size: .95rem; outline: none;
        transition: border-color .2s;
      }
      .inp:focus { border-color: #f0b429; }
      .pass-wrap { position: relative; }
      .pass-wrap .inp { width: 100%; padding-left: 2.8rem; }
      .pass-toggle {
        position: absolute; left: .6rem; top: 50%; transform: translateY(-50%);
        background: none; border: none; cursor: pointer; font-size: 1.1rem;
      }
      .btn-submit {
        background: linear-gradient(135deg,#f0b429,#e09000); color: #000;
        font-weight: 700; border: none; border-radius: 10px;
        padding: .85rem; font-size: 1rem; cursor: pointer;
        transition: opacity .2s, transform .15s;
      }
      .btn-submit:hover { opacity: .9; transform: translateY(-1px); }
      .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }
      .auth-err { color: #e74c3c; font-size: .85rem; min-height: 1.2em; text-align: center; }
      .back-link { color: #f0b429; font-size: .85rem; text-decoration: none; }
      .back-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="logo">⚡</div>
    <h2>AlphaCoin Miner</h2>
    <p>تسجيل الدخول بالبريد الإلكتروني</p>

    <div class="card">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input class="inp" id="email" type="email" placeholder="example@gmail.com"
               autocomplete="email" autocapitalize="none" spellcheck="false" dir="ltr"/>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <div class="pass-wrap">
          <input class="inp" id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
          <button class="pass-toggle" id="toggle-pass" type="button">👁</button>
        </div>
      </div>
      <div class="auth-err" id="err"></div>
      <button class="btn-submit" id="btn-login">دخول ⚡</button>
    </div>

    <a href="/" class="back-link">← العودة للرئيسية</a>

    <script type="module">
      import { initializeApp }   from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
                                 from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDIsEEXCafhtSizdUHkM6BKaCuTdMH1KUQ",
        authDomain: "alphacoin-27d62.firebaseapp.com",
        databaseURL: "https://alphacoin-27d62-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "alphacoin-27d62",
        storageBucket: "alphacoin-27d62.firebasestorage.app",
        messagingSenderId: "264895286078",
        appId: "1:264895286078:web:bae0b3cf7096499637ba6f"
      };

      const app  = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const emailInp = document.getElementById("email");
      const passInp  = document.getElementById("password");
      const btnLogin = document.getElementById("btn-login");
      const errEl    = document.getElementById("err");
      const togglePw = document.getElementById("toggle-pass");

      // Redirect if already signed in
      onAuthStateChanged(auth, user => {
        if (user) window.location.href = "/";
      });

      togglePw.addEventListener("click", () => {
        passInp.type = passInp.type === "password" ? "text" : "password";
        togglePw.textContent = passInp.type === "password" ? "👁" : "🙈";
      });

      btnLogin.addEventListener("click", doLogin);
      passInp.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
      emailInp.addEventListener("keydown", e => { if (e.key === "Enter") passInp.focus(); });

      async function doLogin() {
        const email    = emailInp.value.trim().toLowerCase();
        const password = passInp.value;
        if (!email)             { errEl.textContent = "أدخل البريد الإلكتروني"; return; }
        if (!email.includes("@")) { errEl.textContent = "صيغة البريد الإلكتروني غير صحيحة"; return; }
        if (!password)          { errEl.textContent = "أدخل كلمة المرور"; return; }

        errEl.textContent = "";
        btnLogin.disabled = true;
        btnLogin.textContent = "جار الدخول…";

        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (e) {
          const msgs = {
            "auth/user-not-found":         "البريد الإلكتروني غير مسجل",
            "auth/wrong-password":         "كلمة المرور خاطئة",
            "auth/invalid-credential":     "البريد الإلكتروني أو كلمة المرور خاطئة",
            "auth/too-many-requests":      "محاولات كثيرة، انتظر قليلاً",
            "auth/network-request-failed": "خطأ في الاتصال بالإنترنت",
            "auth/invalid-email":          "صيغة البريد الإلكتروني غير صحيحة",
          };
          errEl.textContent    = msgs[e.code] || ("خطأ: " + e.message);
          btnLogin.disabled    = false;
          btnLogin.textContent = "دخول ⚡";
        }
      }
    </script>
  </body>
  </html>
