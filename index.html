<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>AlphaCoin Miner</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
  </head>
  <body>
  <div id="particles"></div>
  <div id="loading"><div class="spinner"></div></div>

  <div id="app">

    <!-- ══ AUTH SCREEN ══ -->
    <div id="auth-screen" style="display:none">
      <div class="auth-logo">
        <div class="auth-icon">⚡</div>
        <div class="auth-title">AlphaCoin</div>
        <div class="auth-sub">MINER</div>
      </div>
      <p class="auth-desc">عدّن عملات Alpha يومياً واحصل على مكافآت</p>
      <button class="btn-google-login" id="google-login-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" width="22"/>
        الدخول بحساب Google
      </button>
      <div class="auth-err" id="auth-err"></div>
    </div>

    <!-- ══ GAME CONTAINER ══ -->
    <div id="game-container" style="display:none">

      <!-- NAV -->
      <nav>
        <div class="nav-brand">⚡ AlphaCoin</div>
        <div class="nav-right">
          <img id="user-photo" class="user-avatar" src="" alt="" style="display:none" onerror="this.style.display='none'"/>
          <span class="nav-username" id="user-name"></span>
          <button class="btn-logout" id="logout-btn">خروج</button>
        </div>
      </nav>

      <!-- TABS — 2 only -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="mine">⛏ تعدين</button>
        <button class="tab-btn" data-tab="profile">👤 حسابي</button>
      </div>

      <!-- ── MINE TAB ── -->
      <div class="tab-content active" id="tab-mine">
        <div class="mine-section">

          <!-- Balance card -->
          <div class="balance-card">
            <div class="bc-label">رصيدك الحالي</div>
            <div class="bc-amount"><span class="bc-sym">α</span><span id="balance">0.0000</span></div>
            <div class="bc-row">
              <div class="bc-stat"><span class="bc-stat-lbl">إجمالي التعدين</span><span class="bc-stat-val" id="total-mined">0.0000</span></div>
              <div class="bc-divider"></div>
              <div class="bc-stat"><span class="bc-stat-lbl">عمليات اليوم</span><span class="bc-stat-val"><span id="daily-count">0</span><span style="color:#555">/50</span></span></div>
            </div>
          </div>

          <!-- Mine button -->
          <div class="mine-area">
            <div class="mine-rings">
              <div class="mine-ring r1"></div>
              <div class="mine-ring r2"></div>
              <div class="mine-ring r3"></div>
            </div>
            <button class="mine-btn" id="mine-btn">
              <span class="mine-icon">⛏</span>
              <span class="mine-label">MINE</span>
            </button>
          </div>

          <div class="mine-status">
            تبقّى لك <strong id="mines-left">50</strong> عملية اليوم
          </div>

          <!-- Coupon -->
          <div class="coupon-card">
            <div class="coupon-title">🎁 استبدال قسيمة</div>
            <div class="coupon-row">
              <input class="inp" id="coupon-code" type="text" placeholder="أدخل كود القسيمة" autocomplete="off" spellcheck="false" style="direction:ltr;letter-spacing:2px"/>
              <button class="btn-redeem" id="redeem-btn">تطبيق</button>
            </div>
            <div class="coupon-msg" id="coupon-msg"></div>
          </div>

        </div>
      </div><!-- /tab-mine -->

      <!-- ── PROFILE TAB ── -->
      <div class="tab-content" id="tab-profile">
        <div class="profile-section">
          <div class="profile-card" id="profile">
            <div class="profile-avatar-wrap">
              <img id="profile-photo" class="profile-photo" src="" alt="" style="display:none" onerror="this.style.display='none'"/>
              <div class="profile-fallback" id="profile-avatar-fallback">⚡</div>
            </div>
            <h2 class="profile-name" id="profile-name"></h2>
            <div class="profile-email" id="profile-email"></div>
            <div class="profile-stats">
              <div class="pstat">
                <div class="pstat-val" id="profile-balance">0.0000</div>
                <div class="pstat-lbl">الرصيد (α)</div>
              </div>
              <div class="pstat">
                <div class="pstat-val" id="profile-total">0.0000</div>
                <div class="pstat-lbl">إجمالي التعدين</div>
              </div>
              <div class="pstat">
                <div class="pstat-val" id="profile-daily">0/50</div>
                <div class="pstat-lbl">عمليات اليوم</div>
              </div>
              <div class="pstat">
                <div class="pstat-val" id="profile-rank">-</div>
                <div class="pstat-lbl">الترتيب</div>
              </div>
            </div>
          </div>
          <div id="admin-btn-wrap" style="display:none">
            <a href="/admin" class="admin-link-btn">🔐 لوحة تحكم الأدمن</a>
          </div>
        </div>
      </div><!-- /tab-profile -->

    </div><!-- /game-container -->
  </div><!-- /app -->

  <div class="toast" id="toast"></div>
  <script type="module" src="script.js"></script>
  </body>
  </html>
